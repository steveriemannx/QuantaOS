[package]
description = "Khronos Vulkan loader (libvulkan)"

[source]
tar = "https://codeload.github.com/KhronosGroup/Vulkan-Loader/tar.gz/refs/tags/vulkan-sdk-1.4.350.1"
blake3 = "6cc1b4501735b068b6fe2bde57ff96237a329ce30c819c6698be585026c63d0e"

[build]
template = "custom"
dev-dependencies = [
    "vulkan-headers",
]
script = """
DYNAMIC_INIT

# Cookbook cross files use CMAKE_SYSTEM_NAME=UnixPaths for Redox, while the
# loader only recognizes Unix-like platforms by name. Teach it about UnixPaths
# so the shared library path is taken instead of "Unsupported Platform!".
sed -i 's/elseif(CMAKE_SYSTEM_NAME MATCHES "Linux|BSD|DragonFly|GNU|CYGWIN")/elseif(CMAKE_SYSTEM_NAME MATCHES "Linux|BSD|DragonFly|GNU|CYGWIN|UnixPaths")/' "${COOKBOOK_SOURCE}/CMakeLists.txt"

# The loader keys its platform support off compiler macros, not CMake's
# system name. Redox is a common-UNIX platform with pthread/dlopen, so reuse
# the Unix (Linux-style) definitions instead of falling into the
# "must be modified for this OS" stubs.
sed -i 's/#if defined(__linux__) || defined(__APPLE__)/#if defined(__linux__) || defined(__redox__) || defined(__APPLE__)/' "${COOKBOOK_SOURCE}/loader/vk_loader_platform.h"
sed -i 's/#if defined(__linux__) || defined(__GNU__) || defined(__CYGWIN__)/#if defined(__linux__) || defined(__redox__) || defined(__GNU__) || defined(__CYGWIN__)/' "${COOKBOOK_SOURCE}/loader/vk_loader_platform.h"

# Redox has no X11, Wayland or DirectFB, so build the portable loader only.
# The GAS unknown-function thunks require a Linux-specific offset table; the
# fallback returns NULL for functions the loader does not know about.
COOKBOOK_CMAKE_FLAGS+=(
    -DBUILD_TESTS=OFF
    -DBUILD_WSI_XCB_SUPPORT=OFF
    -DBUILD_WSI_XLIB_SUPPORT=OFF
    -DBUILD_WSI_XLIB_XRANDR_SUPPORT=OFF
    -DBUILD_WSI_WAYLAND_SUPPORT=OFF
    -DBUILD_WSI_DIRECTFB_SUPPORT=OFF
    -DUSE_GAS=OFF
)

cookbook_cmake
"""
