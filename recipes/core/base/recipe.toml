[package]
description = "Essential system components and drivers for Redox"

[source]
git = "https://gitlab.redox-os.org/redox-os/base.git"
rev = "7d40d29b0110f1fa1ebeaa02e2e7977ac648f58f"
patches = [
  "patches/0001-virtio-gpud-virgl.patch",
  "patches/0002-quanta-gpud-prototype.patch",
]

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
