# Temporary test image: Mesa/lavapipe + Vulkan loader + smoke test.
include = ["minimal.toml"]

[general]
filesystem_size = 1024

[packages]
libdrm = "binary"
llvm21 = "binary"
mesa = "binary"
libvulkan = {}
vulkan-smoketest = {}
ferritic-blade-snapshot = {}

[[files]]
path = "/usr/lib/init.d/90_vulkan_smoke"
data = """
nowait /usr/bin/vulkan-smoketest
"""
