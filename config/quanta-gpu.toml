# QuantaGPU v0 test image: the pure-Rust display service owns a VT and a
# fullscreen CPU-rendered demo presents through /scheme/quanta-gpu.
include = ["minimal.toml"]

[general]
filesystem_size = 512

[packages]
quanta-gpu = {}

# Keep the active VT for quanta-gpud instead of switching to the console VT.
[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = ""

[[files]]
path = "/usr/lib/init.d/30_quanta-demo"
data = """
requires_weak 20_quanta-gpud.service
nowait quanta-demo
"""
