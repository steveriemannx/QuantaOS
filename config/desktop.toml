# Default build system configuration

include = ["desktop-minimal.toml", "server.toml"]

# General settings
[general]
# Filesystem size in MiB (Vulkan: llvm21 + Mesa/lavapipe need ~180 MiB more)
filesystem_size = 1024

# Package settings
[packages]
dejavu = {}
ferriticui = {}
file = {}
freefont = {}
hicolor-icon-theme = {}
installer-gui = {}
libvulkan = {}
mesa = {}
netsurf = {}
patchelf = {}
pop-icon-theme = {}
shared-mime-info = {}
# orbterm from desktop-minimal should be ignored
orbterm = "ignore"
