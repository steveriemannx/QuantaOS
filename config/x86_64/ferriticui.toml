# FerriticUI test image: the pre-Vulkan desktop package set plus the local
# ferriticui recipe. Boot to a clean login; after logging in the Terminal and
# Counter entries are available in the launcher/taskbar.

include = ["../desktop-minimal.toml", "../server.toml"]

# General settings
[general]
filesystem_size = 700

# Package settings
[packages]
dejavu = {}
ferriticui = {}
file = {}
freefont = {}
hicolor-icon-theme = {}
installer-gui = {}
netsurf = {}
patchelf = {}
pop-icon-theme = {}
shared-mime-info = {}
# orbterm from desktop-minimal is not in the cached package repo
orbterm = "ignore"
